<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Xavier T.S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <header class="brand">Xavier T.S</header>

      <section class="project-info">
        <p class="info-label">Project</p>
        <div class="info-body" id="info-body"><!-- filled by JS --></div>
      </section>
    </aside>

    <!-- ===== Gallery ===== -->
    <section class="gallery" id="gallery" aria-label="Project images — click to advance">
      <div class="track" id="track"><!-- slides filled by JS --></div>
    </section>

    <!-- ===== Footer row ===== -->
    <nav class="menu">
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <a href="#projects">Projects</a>
    </nav>

    <div class="pagination" id="pagination"><!-- numbers filled by JS --></div>

    <!-- ===== Grid overlay (toggle with "G") ===== -->
    <div class="grid-overlay" id="grid-overlay" aria-hidden="true"><!-- columns filled by JS --></div>

  </div>

  <script>
    // ===== Project: one continuous strip of images, shown two at a time =====
    const project = {
      info: [
        "Identity development for an alternative medicine telehealth clinic created by Aura theraputics.",
        "Designed in partnership with Samson Ossendryver Studio.",
        "Images used in this concept are not owned or produced by Aura theraputics."
      ],
      imageCount: 6   // placeholder boxes for now
    };

    const PER_VIEW = 2; // boxes displayed at once

    const track      = document.getElementById('track');
    const infoBody   = document.getElementById('info-body');
    const pagination = document.getElementById('pagination');

    // Group image indices into fixed pairs: (0,1)(2,3)(4,5)(6)
    const views = [];
    for (let i = 0; i < project.imageCount; i += PER_VIEW) {
      const view = [];
      for (let k = 0; k < PER_VIEW && i + k < project.imageCount; k++) view.push(i + k);
      views.push(view);
    }
    let current = 0; // current view index

    // Sidebar info (single project, static)
    infoBody.innerHTML = project.info.map(p => `<p>${p}</p>`).join('');

    // Build slides — one per view (last may hold a single box)
    track.innerHTML = views.map(view =>
      `<div class="slide">
         ${view.map(() => '<figure class="panel"></figure>').join('')}
       </div>`
    ).join('');

    // Build pagination numbers — one per image
    pagination.innerHTML = Array.from({ length: project.imageCount }, (_, i) =>
      `<button class="page-num" data-img="${i}" aria-label="Image ${i + 1}">${i + 1}</button>`
    ).join('');
    const pages = Array.from(pagination.children);

    function render() {
      track.style.transform = `translateX(${-current * 100}%)`;
      const visible = views[current];
      // Highlight the displayed images' numbers (light grey); rest stay black
      pages.forEach((b, i) => b.classList.toggle('active', visible.includes(i)));
    }

    function go(viewIndex) {
      const n = views.length;
      current = ((viewIndex % n) + n) % n; // wrap both directions
      render();
    }

    // Click gallery → next pair
    document.getElementById('gallery').addEventListener('click', () => go(current + 1));

    // Click a number → jump to the pair containing that image
    pagination.addEventListener('click', (e) => {
      const btn = e.target.closest('.page-num');
      if (!btn) return;
      const img = Number(btn.dataset.img);
      const viewIndex = views.findIndex(v => v.includes(img));
      if (viewIndex !== -1) go(viewIndex);
    });

    // ===== Grid overlay =====
    const overlay = document.getElementById('grid-overlay');
    const COLS = 20;
    overlay.innerHTML = Array.from({ length: COLS }, () => '<span></span>').join('');

    // Arrow keys → horizontal navigation, "G" → toggle grid overlay
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(current + 1);
      if (e.key === 'ArrowLeft')  go(current - 1);
      if (e.key.toLowerCase() === 'g') overlay.classList.toggle('visible');
    });

    render();
  </script>
</body>
</html>
