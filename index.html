<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Xavier T.S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport">

    <!-- Scrolling content: project info + gallery per page -->
    <div class="pages" id="pages">

      <!-- ===================== PAGE / PROJECT 1 ===================== -->
      <section class="page" data-project="1">
        <section class="gallery" aria-label="Project images — click to advance">
          <div class="track"><!-- slides filled by JS --></div>
        </section>
        <div class="grid-overlay" aria-hidden="true"><!-- columns filled by JS --></div>
      </section>

      <!-- ===================== PAGE / PROJECT 2 ===================== -->
      <section class="page" data-project="2">
        <section class="gallery" aria-label="Project images — click to advance">
          <div class="track"><!-- slides filled by JS --></div>
        </section>
        <div class="grid-overlay" aria-hidden="true"><!-- columns filled by JS --></div>
      </section>

    </div>

    <!-- Fixed chrome: persists across pages; text + numbers fade on page change -->
    <div class="chrome">
      <header class="brand">Xavier T.S</header>
      <section class="project-info" id="project-info">
        <p class="info-label"><!-- filled by JS --></p>
        <div class="info-body"><!-- filled by JS --></div>
      </section>
      <nav class="menu">
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#projects">Projects</a>
      </nav>
      <div class="pagination" id="pagination"><!-- numbers filled by JS --></div>
    </div>

  </div>

  <script>
    (function () {
      const TRANSITION_MS = 1000;   // matches the CSS image-slide duration
      const FADE_MS = 1000;         // matches the CSS fade-IN duration
      const IMAGE_COUNT = 6;
      // two boxes per view (side-by-side on desktop, stacked on mobile)
      const perView = 2;
      const mqMobile = window.matchMedia('(max-width: 720px)');

      // Minimal thin-line left/right arrow cursor in a given colour
      function arrowCursor(dir, color) {
        const d = dir === 'left' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7';
        const svg =
          "<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>" +
          "<path d='" + d + "' fill='none' stroke='" + color + "' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/></svg>";
        return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 12 12, pointer';
      }
      const EDGE_PX = 30;   // px-wide strip at each edge of the frame that navigates

      // Sample an image's left/right edge luminance → contrasting arrow colour
      function edgeArrowColor(img, side) {
        try {
          if (!img || !img.complete || !img.naturalWidth) return 'black';
          const c = document.createElement('canvas');
          c.width = 4; c.height = 40;
          const ctx = c.getContext('2d');
          const sw = Math.max(1, Math.round(img.naturalWidth * 0.12));
          const sx = side === 'left' ? 0 : img.naturalWidth - sw;
          ctx.drawImage(img, sx, 0, sw, img.naturalHeight, 0, 0, 4, 40);
          const data = ctx.getImageData(0, 0, 4, 40).data;
          let sum = 0, n = 0;
          for (let i = 0; i < data.length; i += 4) { sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]; n++; }
          return (sum / n) < 128 ? 'white' : 'black';
        } catch (e) { return 'black'; }
      }

      // Per-page text (shown in the fixed chrome; fades + swaps on page change)
      const PROJECTS = [
        {
          label: "Project 1",
          body: [
            "Identity development for an alternative medicine telehealth clinic created by Aura theraputics.",
            "Designed in partnership with Samson Ossendryver Studio.",
            "Images used in this concept are not owned or produced by Aura theraputics."
          ],
          images: [
            "images/Project%201/UTS/01.jpg",
            "images/Project%201/UTS/02.jpg",
            "images/Project%201/UTS/03.jpg",
            "images/Project%201/UTS/04.jpg",
            "images/Project%201/UTS/05.jpg",
            "images/Project%201/UTS/06.jpg",
            "images/Project%201/UTS/07.jpg",
            "images/Project%201/UTS/08.jpg"
          ]
        },
        {
          label: "Project 2",
          body: [
            "Identity development for an alternative medicine telehealth clinic created by Aura theraputics.",
            "Designed in partnership with Samson Ossendryver Studio.",
            "Images used in this concept are not owned or produced by Aura theraputics."
          ],
          images: []   // placeholder boxes until real images are added
        }
      ];

      // Group image indices into views of `per` (e.g. pairs (0,1)(2,3)(4,5) or singles)
      function buildViews(count, per) {
        const views = [];
        for (let i = 0; i < count; i += per) {
          const view = [];
          for (let k = 0; k < per && i + k < count; k++) view.push(i + k);
          views.push(view);
        }
        return views;
      }

      // ---- Per-page gallery (track + overlay). Text + pagination are external. ----
      function initGallery(page, project, onChange) {
        const track    = page.querySelector('.track');
        const overlay  = page.querySelector('.grid-overlay');
        const images   = project.images || [];
        const count    = images.length || IMAGE_COUNT;   // fall back to placeholder boxes
        let views = [];
        let current = 0;
        let firstImage = 0;   // preserved across rebuilds so we stay on the same image
        let curL = arrowCursor('left', 'black');
        let curR = arrowCursor('right', 'black');
        let cursorZone = null;

        overlay.innerHTML = Array.from({ length: 20 }, () => '<span></span>').join('');

        function build() {
          views = buildViews(count, perView);
          track.innerHTML = views.map(view =>
            `<div class="slide">${view.map(i =>
              images.length
                ? `<figure class="panel"><img src="${images[i]}" alt="" loading="lazy"></figure>`
                : `<figure class="panel"></figure>`
            ).join('')}</div>`
          ).join('');
          current = views.findIndex(v => v.includes(firstImage));
          if (current < 0) current = 0;
          render();
        }
        function render() {
          const slides = track.children;
          for (let i = 0; i < slides.length; i++) {
            slides[i].classList.toggle('active', i === current);
          }
          updateCursorColors();
          if (onChange) onChange();
        }
        // Pick a black/white arrow per visible image so it stays legible
        function updateCursorColors() {
          if (mqMobile.matches) return;
          const slide = track.children[current];
          if (!slide) return;
          const imgs = slide.querySelectorAll('img');
          if (imgs[0]) {
            const apply = () => { curL = arrowCursor('left', edgeArrowColor(imgs[0], 'left')); cursorZone = null; };
            imgs[0].complete ? apply() : imgs[0].addEventListener('load', apply, { once: true });
          }
          if (imgs[1]) {
            const apply = () => { curR = arrowCursor('right', edgeArrowColor(imgs[1], 'right')); cursorZone = null; };
            imgs[1].complete ? apply() : imgs[1].addEventListener('load', apply, { once: true });
          }
        }
        function go(viewIndex) {
          const n = views.length;
          current = ((viewIndex % n) + n) % n;
          firstImage = views[current][0];
          render();
        }
        // Click left half (the left image) → previous set; right half → next set
        const gallery = page.querySelector('.gallery');
        // Which edge zone is the pointer in? ('L' left edge, 'R' right edge, 'M' middle)
        function edgeZone(e) {
          const rect = gallery.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < EDGE_PX) return 'L';
          if (x > rect.width - EDGE_PX) return 'R';
          return 'M';
        }
        gallery.addEventListener('click', (e) => {
          if (mqMobile.matches) return;   // mobile uses native scroll, not click-nav
          const z = edgeZone(e);
          if (z === 'L') go(current - 1);
          else if (z === 'R') go(current + 1);
          // middle: do nothing
        });
        // Hover: arrow cursor only at the edges; default cursor in the middle
        gallery.addEventListener('mousemove', (e) => {
          if (mqMobile.matches) return;
          const z = edgeZone(e);
          if (z !== cursorZone) {
            gallery.style.cursor = z === 'L' ? curL : z === 'R' ? curR : 'default';
            cursorZone = z;
          }
        });
        build();

        return {
          go,
          next: () => go(current + 1),
          prev: () => go(current - 1),
          get current() { return current; },
          get views() { return views; },
          get imageCount() { return count; },
          rebuild: build,
          toggleOverlay: () => overlay.classList.toggle('visible')
        };
      }

      const pageEls = Array.from(document.querySelectorAll('.page'));
      let galleries = [];
      let section = 0;
      let animating = false;

      // ---- Shared, fixed project text ----
      const projectInfo = document.getElementById('project-info');
      const infoLabel = projectInfo.querySelector('.info-label');
      const infoBody  = projectInfo.querySelector('.info-body');
      const viewport  = document.querySelector('.viewport');
      // Mobile: tap the title to expand/collapse the project text
      infoLabel.addEventListener('click', () => viewport.classList.toggle('expanded'));
      function renderProjectInfo() {
        const p = PROJECTS[section];
        infoLabel.textContent = p.label;
        infoBody.innerHTML = p.body.map(x => `<p>${x}</p>`).join('');
        viewport.classList.remove('expanded');   // reset to collapsed on page change
      }

      // ---- Shared, fixed pagination (rebuilt per project, reflects the current page) ----
      const pagination = document.getElementById('pagination');
      function buildPagination(count) {
        pagination.innerHTML = Array.from({ length: count }, (_, i) =>
          `<button class="page-num" data-img="${i}" aria-label="Image ${i + 1}">${i + 1}</button>`
        ).join('');
      }

      function renderPagination() {
        const g = galleries[section];
        if (!g) return;
        const visible = g.views[g.current];
        pagination.querySelectorAll('.page-num').forEach((b, i) => b.classList.toggle('active', visible.includes(i)));
      }

      pagination.addEventListener('click', (e) => {
        const btn = e.target.closest('.page-num');
        if (!btn) return;
        const img = Number(btn.dataset.img);
        const g = galleries[section];
        const vi = g.views.findIndex(v => v.includes(img));
        if (vi !== -1) g.go(vi);
      });

      galleries = pageEls.map((p, i) => initGallery(p, PROJECTS[i], renderPagination));
      buildPagination(galleries[section].imageCount);
      renderPagination();
      renderProjectInfo();

      // ---- Vertical section scroller ----
      const pagesWrap = document.getElementById('pages');

      function goSection(target) {
        target = Math.max(0, Math.min(pageEls.length - 1, target));
        if (target === section || animating) return;
        section = target;
        animating = true;

        // text + numbers fade out immediately; swap content while hidden, then
        // fade back in ONLY after the image slide has fully completed
        pagination.classList.add('fade');
        projectInfo.classList.add('fade');
        pagesWrap.style.transform = `translateY(${-section * 100}vh)`;
        setTimeout(() => {
          buildPagination(galleries[section].imageCount);
          renderPagination();
          renderProjectInfo();
          pagination.classList.remove('fade');
          projectInfo.classList.remove('fade');
        }, TRANSITION_MS);
        // keep locked through the fade-in so a quick scroll can't interrupt it
        setTimeout(() => { animating = false; }, TRANSITION_MS + FADE_MS);
      }

      // Wheel → move one section (desktop only; mobile scrolls natively)
      window.addEventListener('wheel', (e) => {
        if (mqMobile.matches) return;
        e.preventDefault();
        if (animating || Math.abs(e.deltaY) < 8) return;
        goSection(section + (e.deltaY > 0 ? 1 : -1));
      }, { passive: false });

      // Keys: ←/→ navigate images on the current page; ↑/↓ change page; G toggles grid
      window.addEventListener('keydown', (e) => {
        const k = e.key;
        if (k === 'ArrowRight') galleries[section].next();
        else if (k === 'ArrowLeft') galleries[section].prev();
        else if (k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); goSection(section + 1); }
        else if (k === 'ArrowUp'   || k === 'PageUp')   { e.preventDefault(); goSection(section - 1); }
        else if (k.toLowerCase() === 'g') galleries.forEach(g => g.toggleOverlay());
      });

      // Touch swipe (desktop-paged model only). On mobile we use native scroll.
      const SWIPE_MIN = 40;
      let touchX = null, touchY = null;
      window.addEventListener('touchstart', (e) => {
        if (mqMobile.matches) return;   // let native scroll handle mobile
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', (e) => {
        if (touchX === null) return;
        const dx = touchX - e.changedTouches[0].clientX;
        const dy = touchY - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy)) {
          // horizontal swipe → images on the current page
          if (Math.abs(dx) > SWIPE_MIN) {
            if (dx > 0) galleries[section].next();   // swipe left → next set
            else        galleries[section].prev();   // swipe right → previous set
          }
        } else if (Math.abs(dy) > SWIPE_MIN) {
          // vertical swipe → change page
          goSection(section + (dy > 0 ? 1 : -1));
        }
        touchX = touchY = null;
      }, { passive: true });

      // ---- Mobile: continuous scroll updates the project title (scroll-spy) ----
      let scrollSpy = null;
      function setupScrollSpy() {
        if (scrollSpy) { scrollSpy.disconnect(); scrollSpy = null; }
        if (!mqMobile.matches) return;
        const ratios = new Map();
        scrollSpy = new IntersectionObserver((entries) => {
          entries.forEach(e => ratios.set(e.target, e.intersectionRatio));
          let best = section, bestRatio = -1;
          pageEls.forEach((p, i) => {
            const r = ratios.get(p) || 0;
            if (r > bestRatio) { bestRatio = r; best = i; }
          });
          if (best !== section) { section = best; renderProjectInfo(); }
        }, { root: null, threshold: [0, 0.25, 0.5, 0.75, 1] });
        pageEls.forEach(p => scrollSpy.observe(p));
      }
      mqMobile.addEventListener('change', () => {
        section = 0;
        window.scrollTo(0, 0);
        if (!mqMobile.matches) pagesWrap.style.transform = 'translateY(0vh)';
        renderProjectInfo();
        setupScrollSpy();
      });
      setupScrollSpy();
    })();
  </script>
</body>
</html>
